 code:`using System.Collections.Immutable;
using System.Diagnostics.CodeAnalysis;
using System.Globalization;

namespace DeliveryQuotes.Core;

public static class RequestParser
{
    public const string Header = "Id,Customer,DistanceKm,WeightKg";

    public static ParseReport ParseLines(IEnumerable<string>? lines)
    {
        ArgumentNullException.ThrowIfNull(lines);
        var requests = ImmutableArray.CreateBuilder<DeliveryRequest>();
        var errors = ImmutableArray.CreateBuilder<string>();
        var lineNumber = 0;
        var headerSeen = false;

        foreach (var line in lines)
        {
            lineNumber++;
            if (!headerSeen)
            {
                if (!string.Equals((line ?? string.Empty).Trim(), Header, StringComparison.OrdinalIgnoreCase))
                {
                    errors.Add($"Line {lineNumber}: expected header '{Header}'.");
                    return new ParseReport(requests.ToImmutable(), errors.ToImmutable());
                }
                headerSeen = true;
                continue;
            }
            if (string.IsNullOrWhiteSpace(line)) continue;
            if (TryParseLine(line, out var request, out var error)) requests.Add(request);
            else errors.Add($"Line {lineNumber}: {error}");
        }
        if (!headerSeen) errors.Add("Input is empty: the header line is missing.");
        return new ParseReport(requests.ToImmutable(), errors.ToImmutable());
    }

    public static bool TryParseLine(string? line, [NotNullWhen(true)] out DeliveryRequest? request, out string error)
    {
        request = null; error = string.Empty;
        if (line is null) { error = "line is missing (null)."; return false; }
        var fields = line.Split(',');
        if (fields.Length != 4) { error = $"expected 4 fields but found {fields.Length}."; return false; }
        var id = fields[0].Trim(); var customer = fields[1].Trim();
        if (id.Length == 0) { error = "Id is empty."; return false; }
        if (customer.Length == 0) { error = "Customer is empty."; return false; }
        if (!TryParseNumber(fields[2], out var distance)) { error = $"DistanceKm '{fields[2].Trim()}' is not a number."; return false; }
        if (distance <= 0m) { error = $"DistanceKm must be greater than 0 but was {distance}."; return false; }
        if (!TryParseNumber(fields[3], out var weight)) { error = $"WeightKg '{fields[3].Trim()}' is not a number."; return false; }
        if (weight < 0m) { error = $"WeightKg must not be negative but was {weight}."; return false; }
        request = new DeliveryRequest(id, customer, distance, weight);
        return true;
    }

    private static bool TryParseNumber(string text, out decimal value) =>
        decimal.TryParse(text.Trim(), NumberStyles.AllowLeadingSign | NumberStyles.AllowDecimalPoint, CultureInfo.InvariantCulture, out value);
}`,

{id:"policies",name:"PricingPolicies.cs",
 what:{en:"Holds the two price rules, Standard and Express. They are ordinary functions that take an order and return a price.",ru:"Содержит два правила цены: Standard и Express. Это обычные функции, которые берут заказ и возвращают цену.",kk:"Екі баға ережесін қамтиды: Standard және Express. Бұл тапсырысты алып, бағаны қайтаратын қарапайым функциялар."},
 code:`using System.Diagnostics.CodeAnalysis;
namespace DeliveryQuotes.Core;

public static class PricingPolicies
{
    public const decimal FreeWeightKg = 5m;
    public const decimal SurchargePerExtraKg = 50m;

    public static decimal Standard(DeliveryRequest request) => Price(request, baseFee: 600m, perKm: 120m);
    public static decimal Express(DeliveryRequest request) => Price(request, baseFee: 1000m, perKm: 180m);

    public static bool TryGetByName(string? name, [NotNullWhen(true)] out Func<DeliveryRequest, decimal>? policy)
    {
        switch (name?.Trim().ToLowerInvariant())
        {
            case "standard": policy = Standard; return true;
            case "express": policy = Express; return true;
            default: policy = null; return false;
        }
    }

    private static decimal Price(DeliveryRequest request, decimal baseFee, decimal perKm)
    {
        var extraKg = Math.Max(0m, request.WeightKg - FreeWeightKg);
        var raw = baseFee + perKm * request.DistanceKm + extraKg * SurchargePerExtraKg;
        return Math.Round(raw, 0, MidpointRounding.AwayFromZero);
    }
}`,

 code:`using System.Collections.Immutable;
namespace DeliveryQuotes.Core;

{

    {

        ArgumentNullException.ThrowIfNull(rules);
        return requests
            .Select(Normalise)
            .Where(r => r.DistanceKm <= rules.MaxDistanceKm && r.WeightKg <= rules.MaxWeightKg)
            .ToImmutableArray();
    }

    private static DeliveryRequest Normalise(DeliveryRequest request) =>
        request with { Id = request.Id.Trim().ToUpperInvariant(), Customer = request.Customer.Trim() };

 code:`using System.Collections.Immutable;
namespace DeliveryQuotes.Core;

public static partial class PipelineStages
{
    public static ImmutableArray<PricedRequest> PriceRequests(ImmutableArray<DeliveryRequest> eligible, Func<DeliveryRequest, decimal> policy)
    {
        RequireInitialized(eligible, nameof(eligible));
        ArgumentNullException.ThrowIfNull(policy);

        return eligible
            .Select(r => new PricedRequest(r, CheckedPrice(r, policy(r))))
            .ToImmutableArray();
    }

    private static decimal CheckedPrice(DeliveryRequest request, decimal price) =>
        price >= 0m
            ? price
            : throw new InvalidOperationException($"Pricing policy returned a negative price for {request.Id}.");
}`,

 code:`using System.Collections.Immutable;
namespace DeliveryQuotes.Core;

public static partial class PipelineStages
{
    public static QuoteSummary BuildSummary(ImmutableArray<PricedRequest> priced, int skippedCount)
    {
        RequireInitialized(priced, nameof(priced));
        ArgumentOutOfRangeException.ThrowIfNegative(skippedCount);

        var quotes = priced
            .OrderByDescending(p => p.Price)
            .ThenBy(p => p.Request.Id, StringComparer.Ordinal)
            .Select(p => new Quote(p.Request.Id, p.Request.Customer, p.Price))
            .ToImmutableArray();

        return new QuoteSummary(quotes, quotes.Sum(q => q.Price), skippedCount);
    }
}`,

 code:`using System.Collections.Immutable;
namespace DeliveryQuotes.Core;

public static class DeliveryPipeline
{
    public static QuoteSummary Run(ImmutableArray<DeliveryRequest> requests, EligibilityRules rules, Func<DeliveryRequest, decimal> policy)
    {
        var eligible = PipelineStages.SelectEligible(requests, rules);
        var priced = PipelineStages.PriceRequests(eligible, policy);
        return PipelineStages.BuildSummary(priced, requests.Length - eligible.Length);
    }
}`,

 code:`using DeliveryQuotes.Core;

if (args.Length != 2)
{
    Console.Error.WriteLine("Usage: <csv-path> <standard|express|both>");
    return 64;
}

var path = args[0];
var mode = args[1].Trim().ToLowerInvariant();

var policyNames = mode == "both" ? new[] { "standard", "express" } : new[] { mode };
foreach (var name in policyNames)
{
    if (!PricingPolicies.TryGetByName(name, out _))
    {
        Console.Error.WriteLine($"Unknown policy '{args[1]}'. Use standard, express or both.");
        return 64;
    }
}

string[] lines;
try
{
    lines = File.ReadAllLines(path);
}
catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)
{
    Console.Error.WriteLine($"Cannot read '{path}': {ex.Message}");
    return 1;
}

var report = RequestParser.ParseLines(lines);
if (!report.IsValid)
{
    Console.Error.WriteLine($"Input rejected, {report.Errors.Length} problem(s):");
    foreach (var error in report.Errors)
    {
        Console.Error.WriteLine($"  {error}");
    }
    return 2;
}

var totals = new List<decimal>();
foreach (var name in policyNames)
{
    PricingPolicies.TryGetByName(name, out var policy);
    var summary = DeliveryPipeline.Run(report.Requests, EligibilityRules.Default, policy!);
    Print(name, summary);
    totals.Add(summary.TotalPrice);
}

if (totals.Count == 2)
{
    Console.WriteLine($"Express minus standard total: {totals[1] - totals[0]:0} KZT");
}
return 0;

static void Print(string policyName, QuoteSummary summary)
{
    Console.WriteLine($"Policy: {policyName}");
    Console.WriteLine($"Quotes: {summary.Quotes.Length} (not eligible: {summary.SkippedCount})");
    foreach (var q in summary.Quotes)
    {
        Console.WriteLine($"  {q.Id,-6} {q.Customer,-10} {q.Price,7:0} KZT");
    }
    Console.WriteLine($"Total: {summary.TotalPrice:0} KZT");
    Console.WriteLine();
}`,
